[project]
name = "mdrs-sde-theory"
version = "0.3.1"
description = "Simulation and empirical analysis code for the MDRS-SDE paper"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "numba>=0.64.0",
    "pandas>=3.0.2",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
]

[project.scripts]
synthetic_experiments  = "scripts.run_synthetic_experiments:main"
simulation_diagnostics = "scripts.run_simulation_diagnostics:main"
empirical_calibration  = "scripts.run_empirical_calibration:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]